<div id="login-screen" style="display:none">
  <form class="login-box" onsubmit="doLogin(event)">
    <h1>Nexus Dashboard</h1>
    <p class="subtitle" id="login-sub">Sign in to continue</p>
    <div class="form-group"><label>Username</label><input id="login-user" class="form-control" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input id="login-pass" type="password" class="form-control" autocomplete="current-password"></div>
    <div id="login-error" class="error" style="display:none"></div>
    <button class="btn" type="submit">Sign In</button>
  </form>
</div>
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <h1 id="sidebar-title">Nexus Dashboard</h1>
      <p class="subtitle" id="sidebar-sub"></p>
    </div>
  </div>
  <!-- The sidebar is rendered at runtime by core.js renderNav() from
       GET /api/modules/nav — built-in modules, plugins, and the core System
       pages alike. Nothing is hand-written here anymore. -->
  <ul class="nav-list"></ul>
  <div class="sidebar-footer">
    <div class="footer-account">
      <span id="account-user"></span>
      <a href="#" onclick="doLogout(event)">Sign out</a>
    </div>
  </div>
</nav>
<div class="main-col">
  <div class="machine-strip" id="machine-strip" style="display:none"></div>
  <main class="content">
    <div id="page-content"></div>
  </main>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
